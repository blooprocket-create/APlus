name: Verify gameplay baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify deterministic atlas and cell artifacts
        run: |
          npm run world:bake:verify
          npm run world:bake:verify -- --reverse
          npm run world:geo:verify
          npm run world:geo:verify -- --reverse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-v2-preview-bake
          path: |
            public/world-v2/preview/atlas-index.json
            public/world-v2/preview/validation-report.json
            public/world-v2/geography/atlas-index.json
            public/world-v2/geography/validation-report.json
          if-no-files-found: ignore
      - run: npm test
      - name: Chrome Hearthmere entrypoint smoke
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hearthmere-browser-smoke
          path: test-artifacts/browser-smoke/*.png
          if-no-files-found: ignore
      # Compare PR screenshots against the last successful main-branch
      # visual evidence when available. The first run has no baseline.
      - name: Retrieve previous green main screenshots when available
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          baseline_run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow verify.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$baseline_run" ] && [ "$baseline_run" != "null" ]; then
            if ! gh run download "$baseline_run" --repo "$GITHUB_REPOSITORY" --name world-v2-visual-review --dir test-artifacts/visual-baseline; then
              echo "No compatible main-branch visual baseline yet; taking standalone screenshots."
            fi
          fi
      - name: Capture and inspect World V2 geography screenshots
        run: npm run test:visual -- --baseline test-artifacts/visual-baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-v2-visual-review
          path: test-artifacts/world-v2-review/
          if-no-files-found: ignore
          retention-days: 30
      - name: Inventory World V2 legacy imports
        run: |
          npm run audit:world
          npm run audit:world -- --json > world-v2-dependencies.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-v2-dependencies
          path: world-v2-dependencies.json
          if-no-files-found: ignore
