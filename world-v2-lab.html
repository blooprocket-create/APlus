<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Astral Chronicles — World V2 Streaming Lab</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #112a32; color: #f0f4f2; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    #lab { display: block; width: 100%; height: 100%; touch-action: none; }
    #heads-up { position: fixed; top: 14px; left: 14px; max-width: min(440px,calc(100vw - 28px)); background: #10242fdd; border: 1px solid #fff3; border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.45; pointer-events: none; }
    #heads-up strong { display: block; font-size: 17px; }
    #heads-up p { margin: 5px 0 8px; opacity: .85; }
    #status { font-family: ui-monospace, monospace; white-space: pre-line; font-size: 12px; }
    #arrows { position: fixed; right: 14px; bottom: max(14px,env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 48px); gap: 4px; }
    #arrows button { background: #153f52d9; border: 1px solid #98d1db77; color: white; border-radius: 9px; font-size: 20px; touch-action: none; }
    #arrows button:active { background: #2a7e94; }
    @media (min-width: 760px) { #arrows { display: none; } }
  </style>
</head>
<body>
  <canvas id="lab" aria-label="World V2 prototype terrain exploration canvas"></canvas>
  <div id="heads-up">
    <strong>World V2 — Streaming Lab</strong>
    <p>WASD / arrow keys to cross terrain cells; Shift to move faster. This is a <b>temporary heightfield</b>, not final geography, continents, islands or Hearthmere.</p>
    <div id="status">Loading placeholder cells…</div>
  </div>
  <div id="arrows" aria-label="Touch movement controls">
    <span></span><button data-direction="up" aria-label="Move north">▲</button><span></span>
    <button data-direction="left" aria-label="Move west">◀</button>
    <button data-direction="down" aria-label="Move south">▼</button>
    <button data-direction="right" aria-label="Move east">▶</button>
  </div>
  <script type="module" src="/src/world-v2/lab.ts"></script>
</body>
</html>
